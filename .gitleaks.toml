# gitleaks reads this file from the repo root. Library samples are synthetic and use UUIDs as record
# IDs, and the generic-api-key rule reads one under a key such as secretId or tokenId as a secret.
# This allowlist lets through only that: a whole UUID as the value of a key ending in id, in a
# library samples.log or parser file (its !SAMPLE= lines copy sample lines). gitleaks tests an
# allowlist regex against the match or the line, not both, so it can't single out the !SAMPLE=
# lines. Any other value under those keys, and every other finding in a sample, a parser or
# anywhere else, is still reported. studio/core/gitleaks.js holds a copy for the library check.

[extend]
useDefault = true

[[allowlists]]
description = "UUID record IDs under ...Id keys in synthetic library samples and parser files"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^parsers/[^/]+/[^/]+/samples\.log$''', '''^parsers/[^/]+/[^/]+/[A-Z0-9_]+\.parser\.txt$''']
regexTarget = "match"
regexes = ['''(?i)^[\w.-]*id["']?\s*[:=]\s*["']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}["']?$''']

# The rest are each for one rule, one file and the exact values flagged there, so any other value
# in those files is still reported.

[[allowlists]]
description = "The synthetic token ID the Atlassian entry's expected.json stores as access_key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^parsers/atlassian/atlassian-organization-audit-log/expected\.json$''']
regexTarget = "match"
regexes = ['''^access_key"\s*:\s*"c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f"$''']

[[allowlists]]
description = "Fixtures in test/library.test.mjs that check the sample scan flags a secret"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/library\.test\.mjs$''']
regexTarget = "match"
regexes = ['''^session_token=abc123def456'?$''', '''^api_key=3fa85f64-5717-4562-b3fc-2c963f66afa6'?$''']

[[allowlists]]
description = "Fixtures in test/gitleaks.test.mjs that check the library check reports what gitleaks flags"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^test/gitleaks\.test\.mjs$''']
regexTarget = "match"
regexes = ['''^access1, GigaEthernet0\.1 $''', '''^claims_token_id":"3fa85f64-5717-4562-b3fc-2c963f66afa6"$''']
