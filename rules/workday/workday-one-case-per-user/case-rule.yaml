apiVersion: v0.0.1
kind: rule
name: workday_one_case_per_user
title: Workday, one case per user (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Workday security group changed', 'Workday API client registered', 'Workday tenant security setup changed', 'Workday security policy changes activated')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' workday_one_case_per_user')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: workday_security_changes_unofficial
---
apiVersion: v0.0.1
kind: template
name: workday_security_changes_unofficial
title: Workday security configuration changes (unofficial)
description: Case for Workday security configuration changes custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - workday
    type: SECURITY_INVESTIGATION
    title: Workday security configuration changes by one user
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
