apiVersion: v0.0.1
kind: rule
name: esxi_one_case_per_host
title: ESXi, one case per host (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('ESXi Shell turned off the host firewall', 'ESXi Shell weakened code signing checks', 'ESXi Shell stopped virtual machines', 'ESXi Shell deleted virtual machine snapshots')
append_filter: ""
group_by:
    - ${alertHostnames(inputs).map(h, h + ' esxi_one_case_per_host')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: esxi_ransomware_preparation_unofficial
