apiVersion: v0.0.1
kind: rule
name: druva_one_case_per_admin
title: Druva, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Druva administrator created', 'Druva API credentials created')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' druva_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: druva_admin_and_api_credential_changes_unofficial
