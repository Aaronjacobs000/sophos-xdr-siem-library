# Custom detection rules for Druva Cloud Platform, from the Unofficial Sophos Fusion XDR and SIEM Library.
# Sophos Fusion has no import for custom detection rules: add each one under Security Operations >
# Rules > Create Rule, with the fields below. Each rule's title becomes its detections' title.
rules:
  - name: Druva administrator created
    description: Someone created a Druva administrator. An attacker who takes over a backup console adds an admin of their own before deleting backups, so they keep access when the first account is locked.
    severity: high
    mitre:
      - T1136.003
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Druva Cloud Platform'
        and event_name = 'Administrator Created'
  - name: Druva API credentials created
    description: Someone created Druva API credentials or regenerated a key. An API credential reaches backups without the admin console's sign-in or MFA, so an attacker can use one to delete or download data.
    severity: high
    mitre:
      - T1098.001
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Druva Cloud Platform'
        and event_name in ('API Credentials Created', 'API Credentials Key Regenerated')
