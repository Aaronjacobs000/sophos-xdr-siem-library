apiVersion: v0.0.1
kind: rule
name: qnap_one_case_per_nas
title: QNAP, one case per NAS (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('QNAP file renamed with a ransomware extension', 'QNAP ransom note written to a share', 'QNAP Recycle Bin files deleted')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('hostId:')).map(e, e.split(':')[1] + ' qnap_one_case_per_nas')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: qnap_nas_ransomware_activity_unofficial
---
apiVersion: v0.0.1
kind: template
name: qnap_nas_ransomware_activity_unofficial
title: QNAP NAS ransomware activity (unofficial)
description: Case for QNAP NAS ransomware activity custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - qnap
    type: SECURITY_INVESTIGATION
    title: QNAP NAS ransomware activity on one NAS
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
