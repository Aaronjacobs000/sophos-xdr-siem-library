apiVersion: v0.0.1
kind: rule
name: screenconnect_one_case_per_machine
title: ScreenConnect, one case per machine (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('ScreenConnect command added a local account', 'ScreenConnect sent an executable to a machine')
append_filter: ""
group_by:
    - ${alertHostnames(inputs).map(h, h + ' screenconnect_one_case_per_machine')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: screenconnect_remote_session_actions_unofficial
