apiVersion: v0.0.1
kind: rule
name: slack_one_case_per_admin
title: Slack, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Slack member made an admin or owner', 'Slack SSO or two-factor setting changed', 'Slack app scopes expanded')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' slack_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: slack_admin_sso_and_app_changes_unofficial
