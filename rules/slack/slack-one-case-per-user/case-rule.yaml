apiVersion: v0.0.1
kind: rule
name: slack_one_case_per_user
title: Slack, one case per user (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Slack flagged anomalous activity')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('targetUserName:')).map(e, e.split(':')[1] + ' slack_one_case_per_user')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: slack_anomaly_alerts_unofficial
---
apiVersion: v0.0.1
kind: template
name: slack_anomaly_alerts_unofficial
title: Slack anomaly alerts (unofficial)
description: Case for Slack anomaly alerts custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - slack
    type: SECURITY_INVESTIGATION
    title: Slack anomalies for one user
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
