# Custom detection rules for TeamViewer, from the Unofficial Sophos Fusion XDR and SIEM Library.
# Sophos Fusion has no import for custom detection rules: add each one under Security Operations >
# Rules > Create Rule, with the fields below. Each rule's title becomes its detections' title.
rules:
  - name: TeamViewer two-factor enforcement removed
    description: A TeamViewer company admin removed two-factor enforcement from accounts. An attacker who takes over an admin account does this so a stolen password alone opens remote sessions.
    severity: high
    mitre:
      - T1556.006
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'TeamViewer'
        and event_name = 'RemovedTFAEnforcementFromAccounts'
  - name: TeamViewer script token added
    description: Someone added a TeamViewer script token, an API key that acts for the company account. An attacker adds one to keep using TeamViewer's API after the admin's password is changed.
    severity: high
    mitre:
      - T1098.001
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'TeamViewer'
        and event_name = 'ScriptTokenAdded'
  - name: TeamViewer user role assigned
    description: Someone assigned a TeamViewer user role, such as Company administrator, to an account. An attacker gives an account they control admin rights to keep access to every managed device.
    severity: medium
    mitre:
      - T1098.003
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'TeamViewer'
        and event_name = 'UserRoleAssigned'
