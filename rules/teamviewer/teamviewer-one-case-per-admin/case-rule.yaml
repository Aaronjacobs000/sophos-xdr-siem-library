apiVersion: v0.0.1
kind: rule
name: teamviewer_one_case_per_admin
title: TeamViewer, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('TeamViewer two-factor enforcement removed', 'TeamViewer script token added', 'TeamViewer user role assigned')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' teamviewer_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: teamviewer_security_changes_unofficial
