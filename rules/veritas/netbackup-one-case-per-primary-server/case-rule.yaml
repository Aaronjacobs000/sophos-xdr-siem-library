apiVersion: v0.0.1
kind: rule
name: netbackup_one_case_per_primary_server
title: NetBackup, one case per primary server (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('NetBackup backup policy deleted', 'NetBackup policy storage target removed', 'NetBackup backup schedule window changed')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('sensorHostId:')).map(e, e.split(':')[1] + ' netbackup_one_case_per_primary_server')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: netbackup_backup_policy_tampering_unofficial
---
apiVersion: v0.0.1
kind: template
name: netbackup_backup_policy_tampering_unofficial
title: NetBackup backup policy tampering (unofficial)
description: Case for NetBackup backup policy tampering custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - netbackup
    type: SECURITY_INVESTIGATION
    title: NetBackup backup policy tampering on one primary server
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
