apiVersion: v0.0.1
kind: rule
name: gitlab_one_case_per_user
title: GitLab, one case per user (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('GitLab access token created', 'GitLab project made public', 'GitLab audit event streaming changed')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' gitlab_one_case_per_user')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: gitlab_tokens_visibility_and_audit_streaming_unofficial
