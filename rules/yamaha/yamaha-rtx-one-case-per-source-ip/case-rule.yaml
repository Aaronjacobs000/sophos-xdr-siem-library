type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Yamaha RTX administrator mode entered', 'Yamaha RTX login over Telnet', 'Yamaha RTX login locked out')
append_filter: ""
group_by:
