apiVersion: v0.0.1
kind: rule
name: gravityzone_one_case_per_computer
title: GravityZone, one case per computer (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('GravityZone ransomware mitigation', 'GravityZone EDR incident at High severity', 'GravityZone blocked an exploit', 'GravityZone Sandbox Analyzer found a threat')
append_filter: ""
group_by:
    - ${alertHostnames(inputs).map(h, h + ' gravityzone_one_case_per_computer')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: gravityzone_high_severity_alerts_unofficial
---
apiVersion: v0.0.1
kind: template
name: gravityzone_high_severity_alerts_unofficial
title: GravityZone high severity alerts (unofficial)
description: Case for GravityZone high severity alerts custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - bitdefender
    type: SECURITY_INVESTIGATION
    title: GravityZone high severity alerts on one computer
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
