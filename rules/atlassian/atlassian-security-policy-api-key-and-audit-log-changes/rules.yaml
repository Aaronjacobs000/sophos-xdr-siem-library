# Custom detection rules for the Atlassian organization audit log, from the Unofficial Sophos Fusion XDR and SIEM Library.
# Sophos Fusion has no import for custom detection rules: add each one under Security Operations >
# Rules > Create Rule, with the fields below. Each rule's title becomes its detections' title.
rules:
  - name: Atlassian security policy changed
    description: An admin changed an Atlassian organization security policy, such as an authentication policy (SSO, two-step verification, session length) or an IP allowlist. Weakening one opens every member's account.
    severity: high
    mitre:
      - T1556
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Atlassian'
        and event_type = 'Security policies'
  - name: Atlassian admin API key created
    description: An admin created an Atlassian organization API key. An admin key manages users and policies without a sign-in or two-step check, so an attacker with an admin session creates one to keep control.
    severity: high
    mitre:
      - T1098.001
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Atlassian'
        and additional_event_data.record.value = 'Created admin API key'
  - name: Atlassian audit log exported
    description: An admin exported the organization audit log. An attacker reads it to see what is watched and who the admins are before they act.
    severity: medium
    mitre:
      - T1213
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Atlassian'
        and additional_event_data.record.value = 'Exported organization audit log'
