apiVersion: v0.0.1
kind: rule
name: onelogin_one_case_per_admin
title: OneLogin, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('OneLogin admin privilege granted', 'OneLogin admin signed in as another user')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' onelogin_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: onelogin_admin_privileges_and_user_impersonation_unofficial
