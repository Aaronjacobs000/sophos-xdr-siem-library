apiVersion: v0.0.1
kind: rule
name: jumpcloud_one_case_per_admin
title: JumpCloud, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('JumpCloud MFA turned off for a user', 'JumpCloud user created with an API key', 'JumpCloud user added to or removed from a group')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' jumpcloud_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: jumpcloud_mfa_user_and_group_changes_unofficial
