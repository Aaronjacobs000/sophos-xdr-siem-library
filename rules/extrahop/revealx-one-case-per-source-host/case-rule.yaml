apiVersion: v0.0.1
kind: rule
name: revealx_one_case_per_source_host
title: RevealX, one case per source host (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('RevealX ransomware activity', 'RevealX C2 beaconing at High risk')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('sourceHostName:')).map(e, e.split(':')[1] + ' revealx_one_case_per_source_host')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: revealx_ransomware_and_c2_detections_unofficial
