apiVersion: v0.0.1
kind: rule
name: commvault_one_case_per_client
title: Commvault, one case per client (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Commvault detected a ransomware anomaly')
append_filter: ""
group_by:
    - ${alertHostnames(inputs).map(h, h + ' commvault_one_case_per_client')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: commvault_ransomware_anomaly_alerts_unofficial
---
apiVersion: v0.0.1
kind: template
name: commvault_ransomware_anomaly_alerts_unofficial
title: Commvault ransomware anomaly alerts (unofficial)
description: Case for Commvault ransomware anomaly alerts custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - commvault
    type: SECURITY_INVESTIGATION
    title: Commvault ransomware anomaly on one client
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
