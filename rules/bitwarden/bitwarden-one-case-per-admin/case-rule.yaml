apiVersion: v0.0.1
kind: rule
name: bitwarden_one_case_per_admin
title: Bitwarden, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('Bitwarden vault exported', 'Bitwarden organization policy changed', 'Bitwarden member invited')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' bitwarden_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: bitwarden_vault_export_and_admin_changes_unofficial
