# Custom detection rules for Bitwarden, from the Unofficial Sophos Fusion XDR and SIEM Library.
# Sophos Fusion has no import for custom detection rules: add each one under Security Operations >
# Rules > Create Rule, with the fields below. Each rule's title becomes its detections' title.
rules:
  - name: Bitwarden vault exported
    description: "Someone exported a Bitwarden vault: the organization vault from the Admin Console, or their own. An export holds every password in it, so it is what an attacker with a member's session takes first."
    severity: high
    mitre:
      - T1555.005
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Bitwarden'
        and event_name in ('Organization_ClientExportedVault', 'User_ClientExportedVault')
  - name: Bitwarden organization policy changed
    description: An admin changed a Bitwarden organization policy, such as the two-step login, master password or vault export policy. Turning one off weakens every member's account at once.
    severity: medium
    mitre:
      - T1556
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Bitwarden'
        and event_name = 'Policy_Updated'
  - name: Bitwarden member invited
    description: An admin invited someone to the Bitwarden organization. An attacker with an admin session invites an account of theirs to get the shared collections it is given.
    severity: medium
    mitre:
      - T1136.003
    enabled_by_default: true
    query: |-
      from cloudaudit
      where sensor_type = 'Bitwarden'
        and event_name = 'OrganizationUser_Invited'
