apiVersion: v0.0.1
kind: rule
name: ibm_i_one_case_per_system
title: IBM i, one case per system (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('IBM i powerful special authority granted', 'IBM i audit system value changed', 'IBM i security system value changed', 'IBM i service tools user ID changed or reset', 'IBM i program set to adopt owner authority', 'IBM i IBM-supplied profile changed', 'IBM i intrusion monitor event', 'IBM i audit journal receiver deleted')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('sensorHostId:')).map(e, e.split(':')[1] + ' ibm_i_one_case_per_system')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: ibm_i_security_changes_and_intrusion_events_unofficial
