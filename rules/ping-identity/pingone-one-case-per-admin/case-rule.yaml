apiVersion: v0.0.1
kind: rule
name: pingone_one_case_per_admin
title: PingOne, one case per admin (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('PingOne role assigned', 'PingOne identity provider added or changed', 'PingOne MFA policy changed')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('userName:')).map(e, e.split(':')[1] + ' pingone_one_case_per_admin')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: pingone_admin_and_identity_provider_changes_unofficial
