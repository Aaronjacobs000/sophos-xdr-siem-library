apiVersion: v0.0.1
kind: rule
name: pingone_one_case_per_user
title: PingOne, one case per user (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('PingOne MFA check failed')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('targetUserName:')).map(e, e.split(':')[1] + ' pingone_one_case_per_user')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: pingone_mfa_check_failures_unofficial
---
apiVersion: v0.0.1
kind: template
name: pingone_mfa_check_failures_unofficial
title: PingOne MFA check failures (unofficial)
description: Case for PingOne MFA check failures custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - pingone
    type: SECURITY_INVESTIGATION
    title: PingOne MFA check failures for one user
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
