apiVersion: v0.0.1
kind: rule
name: threatdown_ransomware_one_case_per_endpoint
title: ThreatDown ransomware, one case per endpoint (unofficial)
tags:
    - unofficial-library
type: STATIC
order: 90
state: TEST
filter: from detection where metadata.creator.detector.detector_id = 'app:event-filter-ql' and title in ('ThreatDown ransomware detection')
append_filter: ""
group_by:
    - ${alertEntities(inputs).filter(e, e.startsWith('sensorHostId:')).map(e, e.split(':')[1] + ' threatdown_ransomware_one_case_per_endpoint')}
group_count: 1
skip_alert_prioritization: true
is_global: false
template_name: threatdown_ransomware_detections_unofficial
---
apiVersion: v0.0.1
kind: template
name: threatdown_ransomware_detections_unofficial
title: ThreatDown ransomware detections (unofficial)
description: Case for ThreatDown ransomware detections custom detections, from the Unofficial Sophos Fusion XDR and SIEM Library.
tags: []
investigation:
    tags:
        - threatdown
    type: SECURITY_INVESTIGATION
    title: ThreatDown ransomware on one endpoint
    status: OPEN
    priority: "3"
    generate_key_findings: false
    usages:
        - AUTO_INVESTIGATION
