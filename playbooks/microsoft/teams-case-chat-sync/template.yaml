apiVersion: v0.0.1
kind: Playbook
name: Unofficial_Teams_CaseChatSync
version: 1.2.1
title: Teams case chat sync (unofficial)
description: Posts a card to a Teams channel when a case is created or its status, severity, assignee or title changes, or someone comments. The card carries the case's key findings, recommended next steps and latest comments, and names the case so the channel can act on it through the library's chat bridge. From the Unofficial Sophos Fusion XDR and SIEM Library, not from Sophos.
documentation: |
    # Overview
    Posts an Adaptive Card to a Teams channel through a Teams Workflows webhook when a case is created, when its status, severity, assignee or title changes, and when someone comments on it. The card shows the case's short ID, title, tenant, severity, status, assignee and who manages it, with a button that opens the case in Sophos Fusion. Sophos doesn't make, maintain or support this playbook.

    For notifications only, Sophos Fusion's own Send Notification Message template already posts case events to Teams. Use this one when you also run the library's chat bridge, so people in the channel can set a case's status or comment on it from Teams. The card tells them how.

    # The card
    - Tenant: the name of the tenant the case belongs to, as Sophos Fusion names it.
    - Case link: an Open in Sophos Fusion button. Its address holds the tenant ID and the case ID.
    - Case details: the case type, how many detections, assets and events it holds, and its tags.
    - Key findings: the start of the case's key findings, without the recommendations, cut to Section length.
    - Recommendations: the steps under the key findings heading that mentions recommendations, such as Recommended Next Steps, cut to Section length.
    - Recent comments: the latest comments, newest first, each with its author and time. Internal comments, comments that start with the bridge prefix and comments by the ignored subject IDs are left out, and so is the comment a comment card is already about.

    Each section is left out when it's empty or turned off. Links in the key findings point inside Sophos Fusion, so the card shows their text only. Line breaks written as `<br>` show as new lines, and a heading line that holds a whole paragraph, as ITDR finding cases have, shows as text instead of one long bold line. Simple HTML in the key findings and comments, such as `<b>` and `<i>`, shows as bold and italic or as plain text, and each row of a table, Markdown or HTML, shows as one line of Header: value pairs. Key findings saved as rich text, not Markdown, are left out. Times show in each reader's own time zone. Authors are named as Sophos Fusion names them, so a comment written through an API credential shows as Sophos.

    # Filters
    - Minimum severity: cases below it aren't posted. Medium unless you change it.
    - Managed by: any, self (CUSTOMER) or Sophos MDR (PROVIDER).
    - Comments that start with the bridge prefix, `[chat-sync]` unless you change it, aren't posted, so a comment the bridge wrote doesn't come back to the channel.
    - Internal comments aren't posted.
    - Updates are posted only when the status, severity, assignee or title changed.

    # Playbook Inputs
    | Input | What it does | Default |
    | ----- | ------------ | ------- |
    | Minimum severity | 2 Informational, 4 Low, 6 Medium, 8 High, 10 Critical | 6 |
    | Managed by | any, self or sophos | any |
    | Post comments | Post new comments to the channel | On |
    | Bridge comment prefix | Comments that start with it aren't posted | `[chat-sync]` |
    | Ignore comments by | Comma-separated subject IDs whose comments aren't posted | None |
    | Bridge name | The @mention name of your chat bridge's outgoing webhook; leave empty to leave out the reply line | None |
    | Show tenant name | The name of the tenant the case belongs to | On |
    | Show case link | An Open in Sophos Fusion button | On |
    | Show case details | Case type, evidence counts and tags | On |
    | Show key findings | The start of the key findings | On |
    | Show recommendations | The recommended next steps from the key findings | On |
    | Recent comments | How many of the latest comments to show; 0 leaves them out | 3 |
    | Section length | Most characters shown for key findings and for recommendations | 600 |
changeNotes: Simple HTML such as <b> and <i> in key findings and comments shows as bold and italic or plain text instead of raw tags, and each table row, Markdown or HTML, shows as one line of header and value pairs instead of raw pipes or tags.
tags:
    - Type:Notification
connectorCategories:
    - Generic
connectors:
    - Taegis.MicrosoftTeams:1.2.4
    - Taegis.Case:1.0.5
triggerHints:
    - isProactiveResponse: false
      type: platform
      config:
        events:
            - Create
            - Update
            - Comment Added
        source: case
    - isProactiveResponse: false
      type: actions
      config:
        category: response
        context: case
        name: Post case to Teams (unofficial)
inputs:
    properties:
        settings:
            properties:
                bridge_name:
                    default: ""
                    description: The @mention name of the chat bridge's outgoing webhook in Teams. Leave it empty to leave the reply line out of the card.
                    title: Bridge name
                    type: string
                comment_prefix:
                    default: '[chat-sync]'
                    description: Comments that start with this text aren't posted. The chat bridge starts every comment it writes with it.
                    title: Bridge comment prefix
                    type: string
                ignore_authors:
                    default: ""
                    description: Comma-separated subject IDs whose comments aren't posted, such as the chat bridge's API credential
                    title: Ignore comments by
                    type: string
                managed_by:
                    default: any
                    description: Which cases to post. self is CUSTOMER, sophos is PROVIDER (Sophos MDR).
                    enum:
                        - any
                        - self
                        - sophos
                    title: Managed by
                    type: string
                min_severity:
                    default: 6
                    description: Cases below this severity aren't posted. 2 Informational, 4 Low, 6 Medium, 8 High, 10 Critical.
                    enum:
                        - 2
                        - 4
                        - 6
                        - 8
                        - 10
                    title: Minimum severity
                    type: integer
                post_comments:
                    default: true
                    description: Post new comments to the channel
                    title: Post comments
                    type: boolean
                recent_comments:
                    default: 3
                    description: How many of the case's latest comments the card shows, newest first. 0 leaves them out.
                    enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                    title: Recent comments
                    type: integer
                section_length:
                    default: 600
                    description: The most characters the card shows for key findings, and for recommendations. Longer text is cut, and Open in Sophos Fusion has the rest.
                    enum:
                        - 300
                        - 600
                        - 1000
                        - 2000
                    title: Section length
                    type: integer
                show_case_details:
                    default: true
                    description: Show the case type, how many detections, assets and events it holds, and its tags
                    title: Show case details
                    type: boolean
                show_case_link:
                    default: true
                    description: Add an Open in Sophos Fusion button. Its address holds the tenant ID and the case ID.
                    title: Show case link
                    type: boolean
                show_key_findings:
                    default: true
                    description: Show the start of the case's key findings
                    title: Show key findings
                    type: boolean
                show_recommendations:
                    default: true
                    description: Show the recommended next steps from the case's key findings
                    title: Show recommendations
                    type: boolean
                show_tenant:
                    default: true
                    description: Show the name of the tenant the case belongs to
                    title: Show tenant name
                    type: boolean
            title: Playbook settings
            type: object
    type: object
outputs:
    properties:
        posted:
            description: Whether a card was posted
            type: boolean
        reason:
            description: Why no card was posted, when none was
            type: string
    type: object
dsl:
    name: Unofficial_Teams_CaseChatSync
    description: Posts a case card to Teams on case events, within the severity and managed-by filters, skipping comments the chat bridge wrote.
    outcomeStatus: finish.variables.status
    outcomeMessage: finish.variables.message
    outputs:
        posted: finish.variables.posted
        reason: decide.variables.skip
    tasks:
        - name: setup
          let:
            event: "inputs.?event.orValue('manual').lowerAscii()"
            min_severity: "int(inputs.?settings.min_severity.orValue(6))"
            managed_by: "inputs.?settings.managed_by.orValue('any')"
            post_comments: "inputs.?settings.post_comments.orValue(true)"
            prefix: "inputs.?settings.comment_prefix.orValue('[chat-sync]')"
            ignore_authors: "inputs.?settings.ignore_authors.orValue('').split(',').map(a, a.trim()).filter(a, a != '')"
            bridge_name: "inputs.?settings.bridge_name.orValue('').trim()"
            show_details: "inputs.?settings.show_case_details.orValue(true)"
            show_link: "inputs.?settings.show_case_link.orValue(true)"
            show_tenant: "inputs.?settings.show_tenant.orValue(true)"
            show_findings: "inputs.?settings.show_key_findings.orValue(true)"
            show_recommendations: "inputs.?settings.show_recommendations.orValue(true)"
            recent_comments: "int(inputs.?settings.recent_comments.orValue(3))"
            section_length: "int(inputs.?settings.section_length.orValue(600))"
        - name: fetch_case
          action: Taegis.Case.queryCustom
          optional: true
          retry: 2
          inputs:
            tenant_id: caseTenantId(inputs)
            id: caseId(inputs)
            fields: 'id shortId title severity managedBy primaryStatus { name title isClosed } assigneeSubject { displayName } type { title } tags detectionsCount assetsCount eventsCount keyFindings { documentType content }'
        - name: read
          let:
            case: "fetch_case.?outputs.case.orValue({})"
            comment: "setup.variables.event == 'comment added' ? caseComment(inputs) : ''"
            author: "setup.variables.event == 'comment added' ? caseCommentAuthorId(inputs) : ''"
            internal_comment: "setup.variables.event == 'comment added' && (inputs.?case.delta.comment.isInternal.orValue(false) == true || inputs.?case.comment.isInternal.orValue(false) == true)"
            changed: "setup.variables.event == 'update' ? [['Status', caseFieldChanged(inputs, 'primaryStatus')], ['Severity', caseFieldChanged(inputs, 'severity')], ['Assignee', caseFieldChanged(inputs, 'assignee') || caseFieldChanged(inputs, 'assigneeId')], ['Title', caseFieldChanged(inputs, 'title')]].filter(c, c[1]).map(c, c[0]) : []"
        - name: decide
          let:
            severity: "int(read.variables.case.?severity.orValue(0))"
            managed: "read.variables.case.?managedBy.orValue('')"
            skip: |-
                !read.variables.case.?id.hasValue() ? 'The case could not be read, so nothing was posted.' :
                int(read.variables.case.?severity.orValue(0)) < setup.variables.min_severity ? 'The case is below the minimum severity, so nothing was posted.' :
                setup.variables.managed_by == 'self' && read.variables.case.?managedBy.orValue('') != 'CUSTOMER' ? 'The case is not self-managed, so nothing was posted.' :
                setup.variables.managed_by == 'sophos' && read.variables.case.?managedBy.orValue('') != 'PROVIDER' ? 'The case is not managed by Sophos MDR, so nothing was posted.' :
                !(setup.variables.event in ['create', 'update', 'comment added', 'manual']) ? 'This playbook posts creates, updates and comments only.' :
                setup.variables.event == 'update' && size(read.variables.changed) == 0 ? 'No status, severity, assignee or title change, so nothing was posted.' :
                setup.variables.event == 'comment added' && !setup.variables.post_comments ? 'Comments are not posted.' :
                setup.variables.event == 'comment added' && read.variables.internal_comment ? 'The comment is internal, so it was not posted.' :
                setup.variables.event == 'comment added' && read.variables.comment == '' ? 'The event carried no comment text, so nothing was posted.' :
                setup.variables.event == 'comment added' && setup.variables.prefix != '' && read.variables.comment.startsWith(setup.variables.prefix) ? 'The comment came from the chat bridge, so it was not posted back.' :
                setup.variables.event == 'comment added' && read.variables.author in setup.variables.ignore_authors ? 'The comment author is on the ignore list, so it was not posted.' : ''
        - name: fetch_tenant
          condition: "decide.variables.skip == '' && setup.variables.show_tenant && cel.bind(n, inputs.?tenant.name.orValue(''), n == null || n == '')"
          action: Taegis.Case.queryCustom
          optional: true
          retry: 2
          inputs:
            tenant_id: caseTenantId(inputs)
            id: caseId(inputs)
            fields: 'id tenant { name }'
        - name: fetch_comments
          condition: "decide.variables.skip == '' && setup.variables.recent_comments > 0"
          action: Taegis.Case.getComments
          optional: true
          retry: 2
          inputs:
            tenant_id: caseTenantId(inputs)
            caseId: caseId(inputs)
            orderBy: 'DESCENDING'
            perPage: 25
            visibility: 'NOT_INTERNAL'
        - name: notes
          condition: "decide.variables.skip == ''"
          let:
            source: |-
                cel.bind(p, (read.variables.case.?keyFindings.documentType.orValue('MARKDOWN') == 'MARKDOWN' && read.variables.case.?keyFindings.content.orValue('') != null ? read.variables.case.?keyFindings.content.orValue('') : '').replace('\r', '').replace('`', '').split(']('),
                  cel.bind(parts, [p[0]] + p.slice(1, size(p)).map(x, x.indexOf(')') >= 0 ? x.substring(x.indexOf(')') + 1) : x),
                    (parts.slice(0, size(parts) - 1).map(x, x.lastIndexOf('[') >= 0 ? x.substring(0, x.lastIndexOf('[')) + x.substring(x.lastIndexOf('[') + 1) : x) + [parts[size(parts) - 1]]).join('')))
            comments: |-
                cel.bind(l, fetch_comments.?outputs.comments.orValue([]), l == null ? [] : l).filter(c,
                  c.?comment.orValue('') != null && c.?comment.orValue('').trim() != '' &&
                  !(setup.variables.prefix != '' && c.comment.startsWith(setup.variables.prefix)) &&
                  !(c.?authorId.orValue('') in setup.variables.ignore_authors) &&
                  !(setup.variables.event == 'comment added' && c.comment == read.variables.comment))
        - name: markup
          condition: "decide.variables.skip == ''"
          let:
            texts: |-
                ([notes.variables.source, read.variables.comment] +
                  cel.bind(l, notes.variables.comments, size(l) > setup.variables.recent_comments ? l.slice(0, setup.variables.recent_comments) : l).map(c, c.comment)).map(s0,
                  cel.bind(s1, cel.bind(a, s0.replace('\r', '').split('<style'), a[0] + a.slice(1, size(a)).map(x, x.indexOf('</style>') >= 0 ? x.substring(x.indexOf('</style>') + 8) : '<style' + x).join('')),
                  cel.bind(s2, cel.bind(a, s1.split('<table'), a[0] + a.slice(1, size(a)).map(x, x.indexOf('</table>') < 0 ? '<table' + x :
                    cel.bind(t, x.substring(0, x.indexOf('</table>')).split('<tr'), cel.bind(rows, t.slice(1, size(t)).map(r, cel.bind(q, r.replace('<th', '<td').split('<td'),
                      q.slice(1, size(q)).map(c, cel.bind(v, c.substring(c.indexOf('>') + 1), (v.indexOf('</t') >= 0 ? v.substring(0, v.indexOf('</t')) : v).replace('\n', ' ').trim())))),
                      '\n' + (size(rows) < 2 ? rows.map(r, r.filter(c, c != '').join(' · ')) : rows.slice(1, size(rows)).map(r, cel.bind(h, rows[0],
                        cel.bind(u, lists.range(size(r)).filter(i, r[i] != '').map(i, i < size(h) && h[i] != '' ? h[i] + ': ' + r[i] : r[i]).join(' · '), u == '' ? '' : '- ' + u)))).filter(l, l != '').join('\n') + '\n' + x.substring(x.indexOf('</table>') + 8)))).join('')),
                  cel.bind(s3, s2.split('\n\n').map(b, cel.bind(ls, b.split('\n'),
                    cel.bind(ds, lists.range(size(ls)).filter(i, i > 0 && (ls[i].contains('-') && ls[i].contains('|') && ls[i].replace('|', '').replace(':', '').replace('-', '').trim() == '') && ls[i - 1].contains('|')), size(ds) == 0 ? b :
                      cel.bind(h, cel.bind(t, ls[ds[0] - 1].trim(), cel.bind(u, t.startsWith('|') ? t.substring(1) : t, (u.endsWith('|') ? u.substring(0, size(u) - 1) : u).split('|').map(c, c.trim()))),
                        (ls.slice(0, ds[0] - 1) + ls.slice(ds[0] + 1, size(ls)).filter(l, !(l.contains('-') && l.contains('|') && l.replace('|', '').replace(':', '').replace('-', '').trim() == '')).map(l, !l.contains('|') ? l :
                          cel.bind(r, cel.bind(t, l.trim(), cel.bind(u, t.startsWith('|') ? t.substring(1) : t, (u.endsWith('|') ? u.substring(0, size(u) - 1) : u).split('|').map(c, c.trim()))),
                            cel.bind(u, lists.range(size(r)).filter(i, r[i] != '').map(i, i < size(h) && h[i] != '' ? h[i] + ': ' + r[i] : r[i]).join(' · '), u == '' ? '' : '- ' + u)))).join('\n'))))).join('\n\n'),
                  cel.bind(m, {'b': ['**', '**'], 'strong': ['**', '**'], 'i': ['*', '*'], 'em': ['*', '*'], 'h1': ['\n**', '**\n'], 'h2': ['\n**', '**\n'], 'h3': ['\n**', '**\n'], 'h4': ['\n**', '**\n'], 'h5': ['\n**', '**\n'], 'h6': ['\n**', '**\n'],
                    'br': ['\n', '\n'], 'hr': ['\n', '\n'], 'p': ['\n', '\n'], 'div': ['\n', '\n'], 'pre': ['\n', '\n'], 'blockquote': ['\n', '\n'], 'ul': ['\n', '\n'], 'ol': ['\n', '\n'], 'table': ['\n', '\n'], 'caption': ['\n', '\n'], 'li': ['\n- ', ''], 'tr': ['\n', ''], 'th': [' ', ' '], 'td': [' ', ' '],
                    'thead': ['', ''], 'tbody': ['', ''], 'tfoot': ['', ''], 'col': ['', ''], 'colgroup': ['', ''], 'span': ['', ''], 'font': ['', ''], 'small': ['', ''], 'big': ['', ''], 'u': ['', ''], 's': ['', ''], 'del': ['', ''], 'ins': ['', ''], 'mark': ['', ''], 'sup': ['', ''], 'sub': ['', ''], 'code': ['', ''], 'kbd': ['', ''], 'tt': ['', ''], 'abbr': ['', ''], 'a': ['', ''], 'img': ['', '']},
                  cel.bind(a, s3.replace('<br />', '<br>').replace('<br/>', '<br>').replace('<BR>', '<br>').replace('<br> ', '\n').replace('<br>', '\n').replace('<b> ', ' <b>').replace(' </b>', '</b> ').replace('<strong> ', ' <strong>').replace(' </strong>', '</strong> ').replace('<i> ', ' <i>').replace(' </i>', '</i> ').replace('<em> ', ' <em>').replace(' </em>', '</em> ').split('<'),
                    cel.bind(ls, (a[0] + a.slice(1, size(a)).map(x, cel.bind(i, x.indexOf('>'),
                      cel.bind(n, i <= 0 ? '' : cel.bind(t, x.substring(x.startsWith('/') ? 1 : 0, i), !t.contains(' ') || t.contains('=') || t.endsWith('/') ? t.split(' ')[0].split('/')[0].lowerAscii() : ''),
                        n in m ? m[n][x.startsWith('/') ? 1 : 0] + x.substring(i + 1) : '<' + x))).join(''))
                      .replace('&nbsp;', ' ').replace('&lt;', '<').replace('&gt;', '>').replace('&quot;', '"').replace('&#39;', "'").replace('&amp;', '&').split('\n'),
                      lists.range(size(ls)).filter(i, ls[i].trim() != '' || (i > 0 && ls[i - 1].trim() != '')).map(i, ls[i]).join('\n').trim())))))))
        - name: layout
          condition: "decide.variables.skip == ''"
          let:
            key_findings: |-
                markup.variables.texts[0]
                  .split('\n').map(l,
                    cel.bind(t, l.trim().startsWith('---') ? l.trim().substring(3).trim() : l.trim(),
                      !t.startsWith('#') ? (t == '' ? '' : l) :
                      cel.bind(h, t.substring([6, 5, 4, 3, 2, 1].filter(n, t.startsWith('######'.substring(0, n)))[0]).trim(),
                        h == '' ? '' :
                        size(h) <= 80 && !h.endsWith('.') ? '# ' + h.replace('**', '') :
                        cel.bind(c, h.indexOf(':'),
                          c > 0 && c <= 40 && h.substring(0, c).replace('*', '').trim() != '' && h.substring(c + 1).trim() != '' ?
                            '# ' + h.substring(0, c).replace('*', '').trim() + '\n' +
                              cel.bind(r, h.substring(c + 1).trim(), h.substring(0, c).contains('**') && r.startsWith('**') ? r.substring(2).trim() : r) :
                            h)))).join('\n')
                  .split('\n\n').map(x, x.trim()).filter(x, x != '').join('\n\n')
        - name: sections
          condition: "decide.variables.skip == ''"
          let:
            findings: |-
                ('\n' + layout.variables.key_findings).split('\n#').filter(s, !s.split('\n')[0].lowerAscii().contains('recommend')).join('\n#')
                  .split('\n').map(l, l.startsWith('#') ? '**' + l.substring(1).trim() + '**' : l).join('\n').trim()
            recommendations: |-
                ('\n' + layout.variables.key_findings).split('\n#').filter(s, s.split('\n')[0].lowerAscii().contains('recommend'))
                  .map(s, s.indexOf('\n') >= 0 ? s.substring(s.indexOf('\n') + 1) : '').join('\n')
                  .split('\n').map(l, l.startsWith('#') ? '**' + l.substring(1).trim() + '**' : l).join('\n').trim()
            recent: |-
                cel.bind(l, notes.variables.comments, lists.range(size(l) > setup.variables.recent_comments ? setup.variables.recent_comments : size(l)).map(k, cel.bind(c, l[k],
                  cel.bind(who, c.?authorId.orValue('') != '' ? resolveSubjectName(c.authorId) : '',
                    cel.bind(at, c.?createdAt.orValue(''), cel.bind(t, markup.variables.texts[k + 2], {
                      'header': (who != '' && who != c.?authorId.orValue('') ? who + ', ' : '') +
                        (size(at) >= 19 ? '{{DATE(' + at.substring(0, 19) + 'Z, SHORT)}} {{TIME(' + at.substring(0, 19) + 'Z)}}' : ''),
                      'text': size(t) > 400 ? t.substring(0, 400) + ' ...' : t
                    }))))))
        - name: card
          condition: "decide.variables.skip == ''"
          let:
            ref: "read.variables.case.?shortId.orValue(caseId(inputs))"
            severity_name: "{2: 'Informational', 4: 'Low', 6: 'Medium', 8: 'High', 10: 'Critical'}[?decide.variables.severity].orValue(string(decide.variables.severity))"
            status_name: "read.variables.case.?primaryStatus.title.orValue(read.variables.case.?primaryStatus.name.orValue('Unknown'))"
            assignee: "read.variables.case.?assigneeSubject.displayName.orValue('Unassigned')"
            managed_name: "decide.variables.managed == 'PROVIDER' ? 'Sophos MDR' : decide.variables.managed == 'CUSTOMER' ? 'Self' : 'Not set'"
            headline: |-
                setup.variables.event == 'create' ? 'New case' :
                setup.variables.event == 'update' ? 'Case updated: ' + read.variables.changed.join(', ') :
                setup.variables.event == 'comment added' ? cel.bind(who, read.variables.author != '' ? resolveSubjectName(read.variables.author) : '', who != '' && who != read.variables.author ? 'New comment from ' + who : 'New comment') :
                'Case shared from Sophos Fusion'
            comment_text: "cel.bind(t, markup.variables.texts[1], size(t) > 1500 ? t.substring(0, 1500) + '...' : t)"
            details: |-
                !setup.variables.show_details ? [] :
                cel.bind(t, read.variables.case.?type.title.orValue(''), t != null && t != '' ? [{'title': 'Type', 'value': t}] : []) +
                [{'title': 'Evidence', 'value': cel.bind(d, int(read.variables.case.?detectionsCount.orValue(0)), string(d) + (d == 1 ? ' detection, ' : ' detections, ')) +
                  cel.bind(a, int(read.variables.case.?assetsCount.orValue(0)), string(a) + (a == 1 ? ' asset, ' : ' assets, ')) +
                  cel.bind(e, int(read.variables.case.?eventsCount.orValue(0)), string(e) + (e == 1 ? ' event' : ' events'))}] +
                cel.bind(t, read.variables.case.?tags.orValue([]), t != null && size(t) > 0 ? [{'title': 'Tags', 'value': t.join(', ')}] : [])
            findings: |-
                !setup.variables.show_findings ? '' :
                size(sections.variables.findings) <= setup.variables.section_length ? sections.variables.findings :
                cel.bind(t, sections.variables.findings.substring(0, setup.variables.section_length),
                  cel.bind(i, t.lastIndexOf('\n\n') > setup.variables.section_length / 2 ? t.lastIndexOf('\n\n') : t.lastIndexOf('\n'),
                    cel.bind(u, (i > setup.variables.section_length / 2 ? t.substring(0, i) : t).trim(),
                      cel.bind(j, u.lastIndexOf('\n'), j > 0 && u.substring(j + 1).startsWith('**') && u.endsWith('**') ? u.substring(0, j).trim() : u)) + ' ...'))
            recommendations: |-
                !setup.variables.show_recommendations ? '' :
                size(sections.variables.recommendations) <= setup.variables.section_length ? sections.variables.recommendations :
                cel.bind(t, sections.variables.recommendations.substring(0, setup.variables.section_length),
                  cel.bind(i, t.lastIndexOf('\n\n') > setup.variables.section_length / 2 ? t.lastIndexOf('\n\n') : t.lastIndexOf('\n'),
                    cel.bind(u, (i > setup.variables.section_length / 2 ? t.substring(0, i) : t).trim(),
                      cel.bind(j, u.lastIndexOf('\n'), j > 0 && u.substring(j + 1).startsWith('**') && u.endsWith('**') ? u.substring(0, j).trim() : u)) + ' ...'))
            tenant: |-
                !setup.variables.show_tenant ? '' :
                cel.bind(e, inputs.?tenant.name.orValue(''), e != null && e != '' ? e :
                  cel.bind(f, fetch_tenant.?outputs.case.tenant.name.orValue(''), f != null ? f : ''))
            link: "setup.variables.show_link ? createShareLink(inputs) : ''"
        - name: build
          condition: "decide.variables.skip == ''"
          let:
            body: |-
                [
                  {'type': 'TextBlock', 'text': card.variables.ref + ': ' + read.variables.case.?title.orValue(caseTitle(inputs)), 'weight': 'Bolder', 'size': 'Medium', 'wrap': true},
                  {'type': 'TextBlock', 'text': card.variables.headline, 'wrap': true, 'spacing': 'None'},
                  {'type': 'FactSet', 'facts': (card.variables.tenant != '' ? [{'title': 'Tenant', 'value': card.variables.tenant}] : []) + [
                    {'title': 'Severity', 'value': card.variables.severity_name},
                    {'title': 'Status', 'value': card.variables.status_name},
                    {'title': 'Assignee', 'value': card.variables.assignee},
                    {'title': 'Managed by', 'value': card.variables.managed_name}
                  ] + card.variables.details}
                ] +
                (card.variables.comment_text != '' ? [{'type': 'TextBlock', 'text': card.variables.comment_text, 'wrap': true}] : []) +
                (card.variables.findings != '' ? [
                  {'type': 'TextBlock', 'text': 'Key findings', 'weight': 'Bolder', 'wrap': true, 'separator': true, 'spacing': 'Medium'},
                  {'type': 'TextBlock', 'text': card.variables.findings, 'wrap': true, 'spacing': 'Small'}
                ] : []) +
                (card.variables.recommendations != '' ? [
                  {'type': 'TextBlock', 'text': 'Recommendations', 'weight': 'Bolder', 'wrap': true, 'separator': true, 'spacing': 'Medium'},
                  {'type': 'TextBlock', 'text': card.variables.recommendations, 'wrap': true, 'spacing': 'Small'}
                ] : []) +
                (size(sections.variables.recent) > 0 ? [{'type': 'TextBlock', 'text': 'Recent comments', 'weight': 'Bolder', 'wrap': true, 'separator': true, 'spacing': 'Medium'}] +
                  sections.variables.recent.map(c, {'type': 'Container', 'spacing': 'Small', 'items':
                    (c.header != '' ? [{'type': 'TextBlock', 'text': c.header, 'isSubtle': true, 'size': 'Small', 'wrap': true}] : []) +
                    [{'type': 'TextBlock', 'text': c.text, 'wrap': true, 'spacing': 'None'}]}) : []) +
                (setup.variables.bridge_name != '' ? [{'type': 'TextBlock', 'isSubtle': true, 'size': 'Small', 'wrap': true, 'text': 'Reply in this channel: @' + setup.variables.bridge_name + ' active ' + card.variables.ref + ' | @' + setup.variables.bridge_name + ' close ' + card.variables.ref + ' <verdict> <note> | @' + setup.variables.bridge_name + ' comment ' + card.variables.ref + ' <text>'}] : [])
            actions: "card.variables.link != '' ? [{'type': 'Action.OpenUrl', 'title': 'Open in Sophos Fusion', 'url': card.variables.link}] : []"
        - name: post
          condition: "decide.variables.skip == ''"
          action: Taegis.MicrosoftTeams.sendWorkflowMessage
          optional: true
          retry: 2
          inputs:
            message_content:
                type: 'message'
                attachments:
                    - contentType: 'application/vnd.microsoft.card.adaptive'
                      content:
                        type: 'AdaptiveCard'
                        body: build.variables.body
                        actions: build.variables.actions
        - name: finish
          let:
            posted: "decide.variables.skip == '' && has(post, 'status') && post.?status.error.orValue('') == ''"
            status: |-
                decide.variables.skip != '' ? 'SUCCESS' :
                has(post, 'status') && post.?status.error.orValue('') == '' ? 'SUCCESS' : 'FAIL'
            message: |-
                decide.variables.skip != '' ? decide.variables.skip :
                has(post, 'status') && post.?status.error.orValue('') == '' ? 'Posted ' + card.variables.ref + ' to Teams: ' + card.variables.headline :
                'Teams did not take the card: ' + post.?status.error.orValue('no response')
