apiVersion: v0.0.1
kind: Playbook
name: Unofficial_Slack_CaseChatSync
version: 1.0.0
title: Slack case chat sync (unofficial)
description: Posts a message to a Slack channel when a case is created or its status, severity, assignee or title changes, or someone comments. With the library's chat bridge, its buttons set the case status or add a comment from Slack. From the Unofficial Sophos Fusion XDR and SIEM Library, not from Sophos.
documentation: |
    # Overview
    Posts a Block Kit message to a Slack channel through the incoming webhook of a Slack app when a case is created, when its status, severity, assignee or title changes, and when someone comments on it. The message shows the case's short ID, title, severity, status, assignee and who manages it, with a button that opens the case in Sophos Fusion. Sophos doesn't make, maintain or support this playbook.

    For notifications only, Sophos Fusion's own Send Notification Message template already posts case events to Slack. Use this one when you also run the library's chat bridge: turn on Two-way buttons and the message gets buttons that set the status, close the case or add a comment, which the bridge carries back to the case.

    # Filters
    - Minimum severity: cases below it aren't posted. Medium unless you change it.
    - Managed by: any, self (CUSTOMER) or Sophos MDR (PROVIDER).
    - Comments that start with the bridge prefix, `[chat-sync]` unless you change it, aren't posted, so a comment the bridge wrote doesn't come back to the channel.
    - Updates are posted only when the status, severity, assignee or title changed.

    # Playbook Inputs
    | Input | What it does | Default |
    | ----- | ------------ | ------- |
    | Minimum severity | 2 Informational, 4 Low, 6 Medium, 8 High, 10 Critical | 6 |
    | Managed by | any, self or sophos | any |
    | Post comments | Post new comments to the channel | On |
    | Bridge comment prefix | Comments that start with it aren't posted | `[chat-sync]` |
    | Ignore comments by | Comma-separated subject IDs whose comments aren't posted | None |
    | Two-way buttons | Add the status, close and comment buttons; needs the chat bridge as the Slack app's interactivity URL | Off |
    | Status buttons | Comma-separated case status names to offer as buttons | active,awaiting_action |
changeNotes: First version
tags:
    - Type:Notification
connectorCategories:
    - Generic
connectors:
    - Taegis.SalesforceSlack:2.1.1
    - Taegis.Case:1.0.5
triggerHints:
    - isProactiveResponse: false
      type: platform
      config:
        events:
            - Create
            - Update
            - Comment Added
        source: case
    - isProactiveResponse: false
      type: actions
      config:
        category: response
        context: case
        name: Post case to Slack (unofficial)
inputs:
    properties:
        settings:
            properties:
                comment_prefix:
                    default: '[chat-sync]'
                    description: Comments that start with this text aren't posted. The chat bridge starts every comment it writes with it.
                    title: Bridge comment prefix
                    type: string
                ignore_authors:
                    default: ""
                    description: Comma-separated subject IDs whose comments aren't posted, such as the chat bridge's API credential
                    title: Ignore comments by
                    type: string
                managed_by:
                    default: any
                    description: Which cases to post. self is CUSTOMER, sophos is PROVIDER (Sophos MDR).
                    enum:
                        - any
                        - self
                        - sophos
                    title: Managed by
                    type: string
                min_severity:
                    default: 6
                    description: Cases below this severity aren't posted. 2 Informational, 4 Low, 6 Medium, 8 High, 10 Critical.
                    enum:
                        - 2
                        - 4
                        - 6
                        - 8
                        - 10
                    title: Minimum severity
                    type: integer
                post_comments:
                    default: true
                    description: Post new comments to the channel
                    title: Post comments
                    type: boolean
                status_buttons:
                    default: active,awaiting_action
                    description: Comma-separated case status names to offer as buttons, which the chat bridge must also allow
                    title: Status buttons
                    type: string
                two_way:
                    default: false
                    description: Add buttons that set the status, close the case or add a comment. Turn it on only once the chat bridge is the Slack app's interactivity request URL.
                    title: Two-way buttons
                    type: boolean
            title: Playbook settings
            type: object
    type: object
outputs:
    properties:
        posted:
            description: Whether a message was posted
            type: boolean
        reason:
            description: Why no message was posted, when none was
            type: string
    type: object
dsl:
    name: Unofficial_Slack_CaseChatSync
    description: Posts a case message to Slack on case events, within the severity and managed-by filters, skipping comments the chat bridge wrote.
    outcomeStatus: finish.variables.status
    outcomeMessage: finish.variables.message
    outputs:
        posted: finish.variables.posted
        reason: decide.variables.skip
    tasks:
        - name: setup
          let:
            event: "inputs.?event.orValue('manual').lowerAscii()"
            min_severity: "int(inputs.?settings.min_severity.orValue(6))"
            managed_by: "inputs.?settings.managed_by.orValue('any')"
            post_comments: "inputs.?settings.post_comments.orValue(true)"
            prefix: "inputs.?settings.comment_prefix.orValue('[chat-sync]')"
            ignore_authors: "inputs.?settings.ignore_authors.orValue('').split(',').map(a, a.trim()).filter(a, a != '')"
            two_way: "inputs.?settings.two_way.orValue(false)"
            status_buttons: "inputs.?settings.status_buttons.orValue('active,awaiting_action').split(',').map(s, s.trim().lowerAscii()).filter(s, s != '' && s != 'closed')"
        - name: fetch_case
          action: Taegis.Case.queryCustom
          optional: true
          retry: 2
          inputs:
            tenant_id: caseTenantId(inputs)
            id: caseId(inputs)
            fields: 'id shortId title severity managedBy primaryStatus { name title isClosed } assigneeSubject { displayName }'
        - name: read
          let:
            case: "fetch_case.?outputs.case.orValue({})"
            comment: "setup.variables.event == 'comment added' ? caseComment(inputs) : ''"
            author: "setup.variables.event == 'comment added' ? caseCommentAuthorId(inputs) : ''"
            changed: "setup.variables.event == 'update' ? [['Status', caseFieldChanged(inputs, 'primaryStatus')], ['Severity', caseFieldChanged(inputs, 'severity')], ['Assignee', caseFieldChanged(inputs, 'assignee') || caseFieldChanged(inputs, 'assigneeId')], ['Title', caseFieldChanged(inputs, 'title')]].filter(c, c[1]).map(c, c[0]) : []"
        - name: decide
          let:
            severity: "int(read.variables.case.?severity.orValue(0))"
            managed: "read.variables.case.?managedBy.orValue('')"
            skip: |-
                !read.variables.case.?id.hasValue() ? 'The case could not be read, so nothing was posted.' :
                int(read.variables.case.?severity.orValue(0)) < setup.variables.min_severity ? 'The case is below the minimum severity, so nothing was posted.' :
                setup.variables.managed_by == 'self' && read.variables.case.?managedBy.orValue('') != 'CUSTOMER' ? 'The case is not self-managed, so nothing was posted.' :
                setup.variables.managed_by == 'sophos' && read.variables.case.?managedBy.orValue('') != 'PROVIDER' ? 'The case is not managed by Sophos MDR, so nothing was posted.' :
                !(setup.variables.event in ['create', 'update', 'comment added', 'manual']) ? 'This playbook posts creates, updates and comments only.' :
                setup.variables.event == 'update' && size(read.variables.changed) == 0 ? 'No status, severity, assignee or title change, so nothing was posted.' :
                setup.variables.event == 'comment added' && !setup.variables.post_comments ? 'Comments are not posted.' :
                setup.variables.event == 'comment added' && read.variables.comment == '' ? 'The event carried no comment text, so nothing was posted.' :
                setup.variables.event == 'comment added' && setup.variables.prefix != '' && read.variables.comment.startsWith(setup.variables.prefix) ? 'The comment came from the chat bridge, so it was not posted back.' :
                setup.variables.event == 'comment added' && read.variables.author in setup.variables.ignore_authors ? 'The comment author is on the ignore list, so it was not posted.' : ''
        - name: card
          condition: "decide.variables.skip == ''"
          let:
            ref: "read.variables.case.?shortId.orValue(caseId(inputs))"
            title: "read.variables.case.?title.orValue(caseTitle(inputs))"
            severity_name: "{2: 'Informational', 4: 'Low', 6: 'Medium', 8: 'High', 10: 'Critical'}[?decide.variables.severity].orValue(string(decide.variables.severity))"
            status_name: "read.variables.case.?primaryStatus.title.orValue(read.variables.case.?primaryStatus.name.orValue('Unknown'))"
            closed: "read.variables.case.?primaryStatus.isClosed.orValue(false)"
            assignee: "read.variables.case.?assigneeSubject.displayName.orValue('Unassigned')"
            managed_name: "decide.variables.managed == 'PROVIDER' ? 'Sophos MDR' : decide.variables.managed == 'CUSTOMER' ? 'Self' : 'Not set'"
            headline: |-
                setup.variables.event == 'create' ? 'New case' :
                setup.variables.event == 'update' ? 'Case updated: ' + read.variables.changed.join(', ') :
                setup.variables.event == 'comment added' ? 'New comment from ' + resolveSubjectName(read.variables.author) :
                'Case shared from Sophos Fusion'
            comment_text: "size(read.variables.comment) > 2500 ? read.variables.comment.substring(0, 2500) + '...' : read.variables.comment"
            link: createShareLink(inputs)
            value: "read.variables.case.?id.orValue('') + '|' + read.variables.case.?shortId.orValue('')"
        - name: build
          condition: "decide.variables.skip == ''"
          let:
            header_text: "size(card.variables.ref + ': ' + card.variables.title) > 150 ? (card.variables.ref + ': ' + card.variables.title).substring(0, 147) + '...' : card.variables.ref + ': ' + card.variables.title"
            buttons: |-
                (card.variables.link != '' ? [{'type': 'button', 'action_id': 'fusion_open', 'text': {'type': 'plain_text', 'text': 'Open in Sophos Fusion'}, 'url': card.variables.link}] : []) +
                (setup.variables.two_way && !card.variables.closed ?
                  setup.variables.status_buttons.map(s, {'type': 'button', 'action_id': 'fusion_status_' + s, 'text': {'type': 'plain_text', 'text': 'Set ' + s.replace('_', ' ')}, 'value': card.variables.value}) +
                  [
                    {'type': 'button', 'action_id': 'fusion_close', 'style': 'danger', 'text': {'type': 'plain_text', 'text': 'Close case'}, 'value': card.variables.value},
                    {'type': 'button', 'action_id': 'fusion_comment', 'text': {'type': 'plain_text', 'text': 'Add comment'}, 'value': card.variables.value}
                  ] : [])
        - name: blocks
          condition: "decide.variables.skip == ''"
          let:
            list: |-
                [
                  {'type': 'header', 'text': {'type': 'plain_text', 'text': build.variables.header_text}},
                  {'type': 'section', 'text': {'type': 'mrkdwn', 'text': card.variables.headline}},
                  {'type': 'section', 'fields': [
                    {'type': 'mrkdwn', 'text': '*Severity*\n' + card.variables.severity_name},
                    {'type': 'mrkdwn', 'text': '*Status*\n' + card.variables.status_name},
                    {'type': 'mrkdwn', 'text': '*Assignee*\n' + card.variables.assignee},
                    {'type': 'mrkdwn', 'text': '*Managed by*\n' + card.variables.managed_name}
                  ]}
                ] +
                (card.variables.comment_text != '' ? [{'type': 'section', 'text': {'type': 'plain_text', 'text': card.variables.comment_text}}] : []) +
                (size(build.variables.buttons) > 0 ? [{'type': 'actions', 'block_id': 'fusion_case', 'elements': build.variables.buttons}] : [])
        - name: post
          condition: "decide.variables.skip == ''"
          action: Taegis.SalesforceSlack.sendMessage
          optional: true
          retry: 2
          inputs:
            request_body:
                text: "'Sophos Fusion case ' + card.variables.ref + ': ' + card.variables.headline"
                blocks: blocks.variables.list
        - name: finish
          let:
            posted: "decide.variables.skip == '' && post.?outputs.outcome.orValue('') == 'success'"
            status: |-
                decide.variables.skip != '' ? 'SUCCESS' :
                post.?outputs.outcome.orValue('') == 'success' ? 'SUCCESS' : 'FAIL'
            message: |-
                decide.variables.skip != '' ? decide.variables.skip :
                post.?outputs.outcome.orValue('') == 'success' ? 'Posted ' + card.variables.ref + ' to Slack: ' + card.variables.headline :
                'Slack did not take the message: ' + toString(post.?status.error.orValue('no response'))
