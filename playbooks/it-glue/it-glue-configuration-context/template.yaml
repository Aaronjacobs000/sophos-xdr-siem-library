apiVersion: v0.0.1
kind: Playbook
name: Unofficial_ITGlue_ConfigurationContext
version: 1.0.0
title: IT Glue configuration context (unofficial)
description: Looks up the host in IT Glue and comments on the case with its organization, configuration type and status, location, contact and a link to its IT Glue record. Read only, and never reads passwords. From the Unofficial Sophos Fusion XDR and SIEM Library, not from Sophos.
documentation: |
    # Overview
    From a host in a case, finds the matching configuration in IT Glue by name and comments on the case with what the MSP has documented about it: the organization, configuration type and status, location, contact, primary IP and a link to the IT Glue record, where the analyst finds the owner and runbooks. It needs the unofficial IT Glue connector from the same library, which only reads and never reads passwords. Sophos doesn't make, maintain or support this playbook.

    # Safety
    - It changes nothing in IT Glue. It adds one comment to the case.
    - IT Glue matches the whole configuration name. The playbook tries the full hostname, then the short name.
    - A run that names more hosts than Most hosts per run (3 unless you change it) looks up none.
    - Organization ID limits the search to one IT Glue organization, which you want when one tenant is one customer.

    # Playbook Inputs
    | Input | What it does | Default |
    | ----- | ------------ | ------- |
    | Most hosts per run | A run that names more hosts looks up none | 3 |
    | Organization ID | Only search this IT Glue organization; empty searches them all | None |
changeNotes: First version
tags:
    - Type:Enrichment
connectorCategories:
    - Generic
connectors:
    - Unofficial_ITGlue:1.0.0
    - Taegis.Case:1.0.5
triggerHints:
    - isProactiveResponse: false
      type: actions
      config:
        category: response
        context: Host
        name: IT Glue configuration context (unofficial)
inputs:
    properties:
        settings:
            properties:
                max_hosts:
                    default: 3
                    description: A run that names more hosts than this looks up none
                    maximum: 10
                    minimum: 1
                    title: Most hosts per run
                    type: integer
                organization_id:
                    default: ""
                    description: Only search this IT Glue organization. Leave it empty to search every organization the key can see.
                    title: Organization ID
                    type: string
            title: Playbook settings
            type: object
    type: object
outputs:
    properties:
        configurations:
            description: Each host, with the IT Glue configuration it matched
            type: array
        status:
            description: SUCCESS, PARTIAL, FAIL or UNKNOWN
            type: string
    type: object
dsl:
    name: Unofficial_ITGlue_ConfigurationContext
    description: Looks up hosts in IT Glue, read only, and comments on the case with what it found.
    outcomeStatus: finish.variables.status
    outcomeMessage: finish.variables.message
    outputs:
        configurations: lookup.variables.found
        status: finish.variables.status
    tasks:
        - name: setup
          let:
            cap: "int(inputs.?settings.max_hosts.orValue(3))"
            case_id: "caseId(inputs)"
            org_id: "inputs.?settings.organization_id.orValue('').trim()"
            hosts: "unique((has(inputs, 'entity') ? entityValue(inputs, 'hostname') : has(inputs, 'asset.hostnames') ? inputs.asset.hostnames.map(h, h.hostname) : []).map(h, h.trim()).filter(h, h != ''))"
        - name: check
          let:
            stop: |-
                size(setup.variables.hosts) == 0 ? 'No hostname came with the trigger, so there was nothing to look up.' :
                size(setup.variables.hosts) > setup.variables.cap ? 'The trigger named ' + string(size(setup.variables.hosts)) + ' hosts, more than the limit of ' + string(setup.variables.cap) + ' a run, so none was looked up.' : ''
        - name: lookup
          condition: "check.variables.stop == ''"
          variables:
            found: []
          range: setup.variables.hosts
          for:
            - name: full
              action: Unofficial_ITGlue.findConfigurations
              optional: true
              retry: 2
              inputs:
                name: lookup.value
                organization_id: setup.variables.org_id
            - name: short
              condition: "size(full.?outputs.configurations.orValue([])) == 0 && lookup.value.contains('.')"
              action: Unofficial_ITGlue.findConfigurations
              optional: true
              retry: 2
              inputs:
                name: "lookup.value.split('.')[0]"
                organization_id: setup.variables.org_id
            - name: pick
              let:
                configs: "size(full.?outputs.configurations.orValue([])) > 0 ? full.outputs.configurations : short.?outputs.configurations.orValue([])"
            - name: note
              let:
                found: |-
                    append(lookup.variables.found,
                      size(pick.variables.configs) == 1 ?
                        {'host': lookup.value, 'matched': true, 'text': lookup.value + ': ' + pick.variables.configs[0].attributes[?'name'].orValue(lookup.value) + ' in ' + pick.variables.configs[0].attributes[?'organization-name'].orValue('an unknown organization') + ', ' + pick.variables.configs[0].attributes[?'configuration-type-name'].orValue('type unknown') + ', status ' + pick.variables.configs[0].attributes[?'configuration-status-name'].orValue('unknown') + ', location ' + pick.variables.configs[0].attributes[?'location-name'].orValue('unknown') + ', contact ' + pick.variables.configs[0].attributes[?'contact-name'].orValue('none') + ', primary IP ' + pick.variables.configs[0].attributes[?'primary-ip'].orValue('unknown') + '. ' + pick.variables.configs[0].attributes[?'resource-url'].orValue('')} :
                      size(pick.variables.configs) > 1 ?
                        {'host': lookup.value, 'matched': false, 'text': lookup.value + ': ' + string(size(pick.variables.configs)) + ' IT Glue configurations have this name, in ' + pick.variables.configs.map(c, c.attributes[?'organization-name'].orValue('?')).join(', ') + '. Set Organization ID to pick one.'} :
                        {'host': lookup.value, 'matched': false, 'text': lookup.value + ': no IT Glue configuration with this name.'})
        - name: finish
          let:
            status: |-
                check.variables.stop != '' ? 'FAIL' :
                !has(lookup, 'variables.found') ? 'UNKNOWN' :
                lookup.variables.found.all(f, f.matched) ? 'SUCCESS' :
                lookup.variables.found.exists(f, f.matched) ? 'PARTIAL' : 'FAIL'
            message: |-
                check.variables.stop != '' ? check.variables.stop :
                has(lookup, 'variables.found') ? lookup.variables.found.map(f, f.text).join(' ') : 'The lookup did not run.'
        - name: comment
          condition: "setup.variables.case_id != ''"
          action: Taegis.Case.addComment
          optional: true
          inputs:
            caseId: setup.variables.case_id
            comment: "'IT Glue (unofficial playbook): ' + finish.variables.message"
