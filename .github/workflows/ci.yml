name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Validate the whole library
        run: node tools/validate-library.mjs --all
      - name: Build the site
        run: node tools/build-site.mjs
      - name: Collector tests
        run: python3 -m unittest discover -s collectors/ai-compliance-logs -p 'test_*.py' -v
