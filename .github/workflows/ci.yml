name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The same gitleaks the secrets job runs, so the unit tests check the library check's port of
      # its generic-api-key rule against it. tools/port-gitleaks.mjs sets both jobs' version and hash.
      # GitHub release downloads can answer 5xx for a while, so the tarball comes from the cache
      # when the cache holds one that matches the pinned hash, and the download retries.
      - name: Cache the gitleaks release for the port tests
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        with:
          path: ${{ runner.temp }}/gitleaks-release
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks for the port tests
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p gitleaks-release
          if ! echo "${GITLEAKS_SHA256}  gitleaks-release/gitleaks.tar.gz" | sha256sum -c - > /dev/null 2>&1; then
            curl -fsSL --retry 8 --retry-max-time 300 -o gitleaks-release/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          echo "${GITLEAKS_SHA256}  gitleaks-release/gitleaks.tar.gz" | sha256sum -c -
          mkdir gitleaks-bin
          tar -xzf gitleaks-release/gitleaks.tar.gz -C gitleaks-bin gitleaks
          gitleaks-bin/gitleaks version
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Unit tests
        run: npm test
      - name: Validate the whole library
        run: node tools/validate-library.mjs --all
      - name: Build the site
        run: node tools/build-site.mjs
      # Runs every bridges/*/test_*.py, so a new bridge is covered without a workflow edit.
      - name: Bridge tests
        run: |
          status=0
          for dir in bridges/*/; do
            [ -d "$dir" ] || continue
            if ! compgen -G "${dir}test_*.py" > /dev/null; then echo "::warning::${dir} has no test_*.py"; continue; fi
            echo "::group::${dir}"
            python3 -m unittest discover -s "$dir" -p 'test_*.py' -v || status=1
            echo "::endgroup::"
          done
          exit $status
  # Scans the commits a pull request adds, or a push to main brings in, for secrets with gitleaks
  # and the repo's .gitleaks.toml. Only GitHub's own actions may run here, so the gitleaks release
  # is downloaded in a step, pinned by version and checked against its SHA-256 before it runs. The
  # cache only saves a download: a cached tarball is used only when it matches the pinned hash.
  # --redact keeps any secret it finds out of the public log.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cache the gitleaks release
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        with:
          path: ${{ runner.temp }}/gitleaks-release
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p gitleaks-release
          if ! echo "${GITLEAKS_SHA256}  gitleaks-release/gitleaks.tar.gz" | sha256sum -c - > /dev/null 2>&1; then
            curl -fsSL --retry 8 --retry-max-time 300 -o gitleaks-release/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          fi
          echo "${GITLEAKS_SHA256}  gitleaks-release/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks-release/gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..$AFTER"
          else
            # No earlier commit to start from, so the whole history.
            RANGE="$AFTER"
          fi
          echo "Scanning $(git rev-list --count "$RANGE") commits: $RANGE"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --log-opts="$RANGE" .
