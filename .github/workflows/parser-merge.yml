# Acts on "Parser checks". It trusts nothing from that run except the pull request number, which
# it checks against the head commit. The check job validates again with the default branch's
# code and a read-only token. The gate job, which can write, takes only the report from it: it
# labels the pull request, posts the report, and merges when the repo allows auto-merge, the
# pull request only adds or updates its author's own entries, and every check on the commit,
# CI included, has finished and passed. Bridge code, and any other file
# outside parsers/, always waits for a maintainer: see tools/lib/merge-rules.mjs, which
# github-gate.mjs checks against the real file list right before it merges the checked commit.
# CI finishing on a pull request starts it too, but it goes on only when the gate's report says
# it held that commit because CI was still running, or because a check failed and CI's run (a
# re-run) has now passed. It then takes the pull request number from the Parser checks run on the
# same commit and runs the whole gate again. It trusts nothing from CI's run but its conclusion.
name: Parser labels and merge

on:
  workflow_run:
    workflows: [Parser checks, CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: parser-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
    outputs:
      skip: ${{ steps.pr.outputs.skip }}
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Find the Parser checks run for the commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # When CI starts this, the newest finished Parser checks run on the same commit gives the
          # pull request number. If none has finished, that run starts the gate when it does.
          if [ "$RUN_PATH" = ".github/workflows/parser-checks.yml" ]; then
            ID=$(echo "$RUN_ID" | tr -dc '0-9')
          else
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/parser-checks.yml/runs?head_sha=$HEAD_SHA&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty' | tr -dc '0-9')
          fi
          if [ -z "$ID" ]; then echo "no finished Parser checks run for this commit; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "id=$ID"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.run.outputs.skip == 'false'
        with:
          name: parser-checks
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Match the pull request to the checked commit
        id: pr
        if: steps.run.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          PR=$(tr -dc '0-9' < artifact/pr-number.txt)
          if [ -z "$PR" ]; then echo "no pull request number"; exit 1; fi
          INFO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.sha, .user.login, .state] | @tsv')
          SHA=$(echo "$INFO" | cut -f1); AUTHOR=$(echo "$INFO" | cut -f2); STATE=$(echo "$INFO" | cut -f3)
          if [ "$SHA" != "$HEAD_SHA" ] || [ "$STATE" != "open" ]; then echo "pull request moved on; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Started by CI: go on only if the gate held this commit because CI was still running, or
          # because a check failed and this CI run passed.
          if [ "$RUN_PATH" != ".github/workflows/parser-checks.yml" ] && ! node base/tools/github-gate.mjs waiting --pr "$PR" --sha "$HEAD_SHA" --ci "$CI_CONCLUSION"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "number=$PR"; echo "author=$AUTHOR"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - name: Fetch the pull request files (data only)
        if: steps.pr.outputs.skip == 'false'
        env:
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git init -q pr
          cd pr
          git fetch -q --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA"
          git checkout -q FETCH_HEAD
      - name: Validate again with trusted code
        if: steps.pr.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          AUTHOR: ${{ steps.pr.outputs.author }}
        run: |
          node base/tools/github-gate.mjs changed --pr "$PR" --out changed.txt
          node base/tools/validate-library.mjs --root pr --base base --changed-files changed.txt --author "$AUTHOR" --report report.json --markdown report.md || true
      - name: Hand the report to the gate job
        if: steps.pr.outputs.skip == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-report
          path: |
            report.json
            report.md
          retention-days: 1
  # The gate job never sees the pull request's files. It matches the pull request to the checked
  # commit again itself, and takes only the report from the check job.
  gate:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # The gate waits up to 10 minutes for CI to finish on the commit before it merges.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Find the Parser checks run for the commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # When CI starts this, the newest finished Parser checks run on the same commit gives the
          # pull request number. If none has finished, that run starts the gate when it does.
          if [ "$RUN_PATH" = ".github/workflows/parser-checks.yml" ]; then
            ID=$(echo "$RUN_ID" | tr -dc '0-9')
          else
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/parser-checks.yml/runs?head_sha=$HEAD_SHA&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty' | tr -dc '0-9')
          fi
          if [ -z "$ID" ]; then echo "no finished Parser checks run for this commit; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "id=$ID"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.run.outputs.skip == 'false'
        with:
          name: parser-checks
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: artifact
      - name: Match the pull request to the checked commit
        id: pr
        if: steps.run.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          PR=$(tr -dc '0-9' < artifact/pr-number.txt)
          if [ -z "$PR" ]; then echo "no pull request number"; exit 1; fi
          INFO=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '[.head.sha, .state] | @tsv')
          SHA=$(echo "$INFO" | cut -f1); STATE=$(echo "$INFO" | cut -f2)
          if [ "$SHA" != "$HEAD_SHA" ] || [ "$STATE" != "open" ]; then echo "pull request moved on; skipping"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          { echo "number=$PR"; echo "skip=false"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.pr.outputs.skip == 'false'
        with:
          name: gate-report
          path: report
      - name: Label, report and merge
        id: merge
        if: steps.pr.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: node base/tools/github-gate.mjs pr --pr "$PR" --sha "$HEAD_SHA" --report report/report.json --markdown report/report.md
  # A merge made with GITHUB_TOKEN starts no push workflows, so Pages would keep the old library
  # snapshot until its daily run. workflow_dispatch is an event GITHUB_TOKEN may start, and this
  # job's token can do nothing else.
  pages:
    needs: gate
    if: needs.gate.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Pages workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
